<footer class="site-footer shell">
  <p>© {{ site.time | date: '%Y' }} {{ site.title }}<span class="footer-note">写代码，拍照片，偶尔更新。</span></p>
  <div class="footer-links">
    <a href="mailto:{{ site.email }}">邮箱 ↗</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
</footer>
{% if site.service-worker %}
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register({{ '/sw.js' | relative_url | jsonify }}, { updateViaCache: 'none' }).catch(function () {});
    });
  }
</script>
{% endif %}
