<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f8f7">
  {% assign meta_description = page.description | default: page.summary | default: site.description %}
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.SEOTitle | escape }}</title>
  <meta name="description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="alternate icon" href="{{ '/img/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/img/favicon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/pwa/icons/512.png' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.SEOTitle | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="manifest" href="{{ '/pwa/manifest.json' | relative_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="{{ site.SEOTitle | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.SEOTitle | escape }}">
  <meta property="og:description" content="{{ meta_description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% if page.cover %}<meta property="og:image" content="{{ page.cover | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}">
  <script src="{{ '/js/blog.js' | relative_url }}" defer></script>
</head>
