title: 瓜瓜
SEOTitle: 瓜瓜的博客
description: "写一行代码，十个 Bug。"
url: "https://saltcoffee.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
email: schromelon@gmail.com

utterances:
  enabled: true
  repo: "saltcoffee/saltcoffee.github.io"
  issue_term: title
  label: Comment
  theme: github-light

markdown: kramdown
highlighter: rouge
permalink: pretty
kramdown:
  input: GFM

# 新文章可用任意文件名；标题和日期写在文章的 front matter 中。
# _posts 仍然兼容，已有链接不变。
collections:
  articles:
    output: true
    permalink: /articles/:path/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: post
      tags: []
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: []

service-worker: true
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - less
  - Gruntfile.js
  - package.json
  - README.md
  - README.zh.md
  - output
  - scripts
  - tests
