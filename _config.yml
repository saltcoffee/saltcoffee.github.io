title: 瓜瓜的博客
SEOTitle: 瓜瓜的博客
description: “Talk is cheap, show me the Bug."
url: "https://blog.redpencil.top"
baseurl: ""
# 修改静态资源时，与 sw.js 中的 ASSET_VERSION 同步更新。
asset_version: "2026-10-15-v27"
lang: zh-CN
timezone: Asia/Shanghai
email: schromelon@gmail.com

twikoo:
  enabled: true
  # Netlify 部署填完整函数地址，必须带 /.netlify/functions/twikoo 后缀：
  #   https://你的站点名.netlify.app/.netlify/functions/twikoo
  # 腾讯云 CloudBase 填环境 ID（不带 https:// 前缀），并在下方 region 填 ap-shanghai。
  env_id: "https://symphonious-wisp-8f5f34.netlify.app/.netlify/functions/twikoo"
  # 仅腾讯云环境需要，其他部署方式留空。
  region: ""
  # 需与后端 twikoo-netlify 版本保持一致。
  version: "2.0.13"

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap
permalink: pretty
kramdown:
  input: GFM

# 新文章可用任意文件名；标题和日期写在文章的 front matter 中。
# _posts 仍然兼容，已有链接不变。
collections:
  articles:
    output: true
    permalink: /articles/:path/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: post
      tags: []
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      tags: []

  # 这些文件仍正常发布，但不作为搜索引擎的内容页面提交。
  - scope:
      path: "google*.html"
    values:
      sitemap: false
  - scope:
      path: "404.html"
    values:
      sitemap: false
  - scope:
      path: "offline.html"
    values:
      sitemap: false
  - scope:
      path: "redirects"
    values:
      sitemap: false

service-worker: true
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - README.md
  - README.zh.md
  - output
