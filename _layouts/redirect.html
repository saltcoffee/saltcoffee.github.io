<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  {% include icons.html %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章地址已更新</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url | escape }}">
  <script>
    window.location.replace({{ page.redirect_to | relative_url | jsonify }} + window.location.search + window.location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | absolute_url | escape }}">
</head>
<body>
  <p>文章地址已更新。<a href="{{ page.redirect_to | relative_url | escape }}">打开文章</a></p>
</body>
</html>
